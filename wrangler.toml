name = "dspace-uploader-worker"
main = "src/index.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Serve static assets (UI) from public directory
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 Database binding
# Replace database_id with your actual D1 ID after running: npx wrangler d1 create dspace-db
[[d1_databases]]
binding = "DB"
database_name = "dspace-db"
database_id = "local-dspace-db"

# Environment variables
[vars]
ENVIRONMENT = "production"
ENCRYPTION_SECRET = "dspace-edge-encryption-key-secret-2026"
